<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Panel – EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#07070f;color:#e2e8f0;min-height:100vh}
    body.light{background:#f6f7fb;color:#111827}
    nav{height:64px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,15,.92);border-bottom:1px solid rgba(255,255,255,.08)}
    body.light nav{background:#fff;border-color:#e5e7eb}
    nav a{color:inherit;text-decoration:none;font-weight:800}
    .page{max-width:1180px;margin:0 auto;padding:34px 22px}
    h1{font-size:2rem;margin-bottom:8px}.muted{color:rgba(255,255,255,.5);margin-bottom:22px}body.light .muted{color:#6b7280}
    .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
    .panel{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:20px}
    body.light .panel{background:#fff;border-color:#e5e7eb}
    label{display:block;font-size:.78rem;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:800;margin:12px 0 6px}
    body.light label{color:#6b7280}
    input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:inherit;font-family:'Inter',sans-serif}
    body.light input,body.light select,body.light textarea{background:#fff;border-color:#d1d5db}
    textarea{min-height:90px}
    button{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
    .course{padding:14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
    body.light .course{border-color:#e5e7eb}
    .course:hover{background:rgba(255,255,255,.04)}
    .lesson{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    body.light .lesson{border-color:#e5e7eb}
    .toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav><a href="dashboard.html">🪺 EduNest</a><div><button onclick="toggleTheme()">Theme</button></div></nav>
<main class="page">
  <h1>Instructor Panel</h1>
  <p class="muted">Upload lessons, video links, PDFs, assignments, quizzes, and view student progress.</p>
  <div class="grid">
    <section class="panel">
      <h2>Courses</h2>
      <div id="courseList"></div>
    </section>
    <section class="panel">
      <h2 id="selectedTitle">Select a course</h2>
      <label>Lesson title</label><input id="lessonTitle" placeholder="Intro to the topic">
      <label>Type</label><select id="lessonType"><option>VIDEO</option><option>PDF</option><option>ASSIGNMENT</option><option>LINK</option></select>
      <label>Video/PDF/resource URL</label><input id="lessonUrl" placeholder="https://...">
      <label>Assignment / notes</label><textarea id="assignment" placeholder="Task, deadline, or instructions"></textarea>
      <label>Sort order</label><input id="sortOrder" type="number" value="1">
      <button onclick="saveLesson()">Save Lesson</button>
      <hr style="border-color:rgba(255,255,255,.08);margin:22px 0">
      <h3>Quiz Question</h3>
      <label>Question</label><textarea id="quizQuestion"></textarea>
      <label>Options</label><input id="qa" placeholder="A"><input id="qb" placeholder="B" style="margin-top:8px"><input id="qc" placeholder="C" style="margin-top:8px"><input id="qd" placeholder="D" style="margin-top:8px">
      <label>Correct option</label><select id="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <label>Attach to lesson</label><select id="quizLesson"></select>
      <button onclick="saveQuiz()">Save Quiz Question</button>
      <hr style="border-color:rgba(255,255,255,.08);margin:22px 0">
      <h3>Lessons</h3>
      <div id="lessons"></div>
      <h3 style="margin-top:18px">Student Progress</h3>
      <div id="progress"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
var role=sessionStorage.getItem('userRole')||'', selected=null, courses=[];
if(role!=='ADMIN'&&role!=='INSTRUCTOR') location.href='dashboard.html';
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
function loadCourses(){var uid=sessionStorage.getItem('userId')||''; var url=role==='ADMIN'?'/courses/all':('/courses/instructor/'+uid); fetch(url,{headers:{'X-User-Role':role,'X-User-Id':uid}}).then(r=>r.json()).then(function(data){courses=data;document.getElementById('courseList').innerHTML=data.map(c=>'<div class="course" onclick="selectCourse('+c.id+')"><strong>'+c.title+'</strong><br><span class="muted">'+c.category+' · '+c.level+'</span></div>').join('')||'<p class="muted">No assigned courses yet.</p>'})}
function selectCourse(id){selected=courses.find(c=>c.id===id);document.getElementById('selectedTitle').textContent=selected.title;loadLessons();loadProgress();}
function loadLessons(){fetch('/lessons/course/'+selected.id).then(r=>r.json()).then(function(ls){document.getElementById('lessons').innerHTML=ls.map(l=>'<div class="lesson"><span>'+l.sortOrder+'. '+l.title+'</span><span>'+l.type+'</span></div>').join('')||'<p class="muted">No lessons yet.</p>';document.getElementById('quizLesson').innerHTML=ls.map(l=>'<option value="'+l.id+'">'+l.title+'</option>').join('')})}
function loadProgress(){fetch('/enrollments/user/0').catch(()=>null);fetch('/analytics/admin',{headers:{'X-User-Role':role}}).then(r=>r.json()).then(function(a){document.getElementById('progress').innerHTML='<p class="muted">Total enrollments: '+(a.totalEnrollments||0)+' · Completion rate: '+(a.completionRate||0)+'%</p>'})}
function saveLesson(){if(!selected){toast('Select a course first');return}fetch('/lessons/save',{method:'POST',headers:{'Content-Type':'application/json','X-User-Role':role},body:JSON.stringify({courseId:selected.id,title:lessonTitle.value,type:lessonType.value,contentUrl:lessonUrl.value,assignment:assignment.value,sortOrder:+sortOrder.value})}).then(r=>r.json()).then(function(){toast('Lesson saved');loadLessons();})}
function saveQuiz(){if(!selected){toast('Select a course first');return}fetch('/quizzes/question',{method:'POST',headers:{'Content-Type':'application/json','X-User-Role':role},body:JSON.stringify({courseId:selected.id,lessonId:+quizLesson.value,question:quizQuestion.value,optionA:qa.value,optionB:qb.value,optionC:qc.value,optionD:qd.value,correctOption:correct.value})}).then(r=>r.json()).then(function(){toast('Quiz saved')})}
loadCourses();
</script>
</body>
</html>
