<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks – EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#07070f;color:#e2e8f0;min-height:100vh}
    body.light{background:#f6f7fb;color:#111827}
    nav{height:64px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,15,.92);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10}
    body.light nav{background:rgba(255,255,255,.92);border-color:#e5e7eb}
    nav a{color:inherit;text-decoration:none;font-weight:800;font-family:'Inter',sans-serif}
    .nav-right{display:flex;gap:10px}
    .nav-right a{color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-weight:700;font-size:.85rem}
    body.light .nav-right a{color:#374151;background:#fff;border-color:#d1d5db}
    .page{max-width:900px;margin:0 auto;padding:40px 22px}
    h1{font-size:1.8rem;font-weight:800;margin-bottom:6px}
    .sub{color:rgba(255,255,255,.45);margin-bottom:28px}
    body.light .sub{color:#6b7280}
    .grid{display:grid;gap:14px}
    .card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    body.light .card{background:#fff;border-color:#e5e7eb}
    .card-info h3{font-size:.95rem;font-weight:700;margin-bottom:4px}
    .card-info p{font-size:.82rem;color:rgba(255,255,255,.45)}
    body.light .card-info p{color:#6b7280}
    .card-actions{display:flex;gap:8px;flex-shrink:0}
    .btn{padding:8px 14px;border:0;border-radius:10px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif}
    .btn-go{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
    .btn-remove{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
    .empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
    .empty .icon{font-size:3rem;margin-bottom:12px}
  </style>
</head>
<body>
<nav>
  <a href="dashboard.html">🪺 EduNest</a>
  <div class="nav-right">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="toggleTheme()">Theme</a>
  </div>
</nav>
<main class="page">
  <h1>🔖 My Bookmarks</h1>
  <p class="sub">Lessons you've saved for quick access</p>
  <div class="grid" id="grid">
    <div class="empty"><div class="icon">🔖</div><p>Loading bookmarks...</p></div>
  </div>
</main>
<script>
var userId = sessionStorage.getItem('userId') || localStorage.getItem('userId');
if (!userId) window.location.href = 'login.html';

fetch('/bookmarks/user/' + userId).then(function(r){ return r.json(); }).then(function(items) {
  var grid = document.getElementById('grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty"><div class="icon">🔖</div><p>No bookmarks yet. Bookmark lessons while studying!</p></div>';
    return;
  }
  grid.innerHTML = items.map(function(b) {
    return '<div class="card" id="bm-' + b.id + '">' +
      '<div class="card-info">' +
        '<h3>' + (b.lessonTitle || 'Lesson') + '</h3>' +
        '<p>' + (b.courseTitle || 'Course') + '</p>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-go" onclick="location.href=\'course-content.html?courseId=' + b.courseId + '\'">Go to Lesson</button>' +
        '<button class="btn btn-remove" onclick="removeBookmark(' + b.id + ',' + b.userId + ',' + b.lessonId + ')">Remove</button>' +
      '</div>' +
    '</div>';
  }).join('');
});

function removeBookmark(id, uid, lessonId) {
  fetch('/bookmarks/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({userId: uid, lessonId: lessonId})
  }).then(function() {
    var el = document.getElementById('bm-' + id);
    if (el) el.remove();
  });
}
</script>
<script src="chatbot.js"></script></body>
</html>
