<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)}
    .card{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 32px 64px rgba(0,0,0,.4)}
    .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;box-shadow:0 8px 24px rgba(99,102,241,.4)}
    .logo{text-align:center;margin-bottom:8px}
    h1{color:#fff;font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:6px}
    .subtitle{color:rgba(255,255,255,.5);font-size:.875rem;text-align:center;margin-bottom:28px}
    label{display:block;color:rgba(255,255,255,.7);font-size:.8rem;font-weight:500;margin-bottom:6px}
    input{width:100%;padding:13px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:.95rem;font-family:'Inter',sans-serif;outline:none;margin-bottom:16px}
    input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
    .footer-link{text-align:center;margin-top:20px;color:rgba(255,255,255,.45);font-size:.875rem}
    .footer-link a{color:#a78bfa;text-decoration:none;font-weight:600}
    .toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:12px;font-size:.9rem;font-weight:500;color:#fff;z-index:9999;opacity:0;transform:translateX(60px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast.success{background:linear-gradient(135deg,#10b981,#059669)}
    .toast.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .token-box{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:14px;margin-top:16px;display:none}
    .token-box p{color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:8px}
    .token-val{font-family:monospace;font-size:.85rem;color:#a78bfa;word-break:break-all}
    .step{display:none}
    .step.active{display:block}
  </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="card">
  <div class="logo"><div class="logo-icon">🔑</div></div>
  <h1>Reset Password</h1>
  <p class="subtitle">Enter your email to get a reset token</p>

  <!-- Step 1: Request token -->
  <div class="step active" id="step1">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
    <button class="btn" onclick="requestReset()">Send Reset Token</button>
    <div class="token-box" id="tokenBox">
      <p>Your reset token (copy this):</p>
      <div class="token-val" id="tokenVal"></div>
      <button class="btn" style="margin-top:12px" onclick="goToStep2()">Use This Token →</button>
    </div>
  </div>

  <!-- Step 2: Reset password -->
  <div class="step" id="step2">
    <label>Reset Token</label>
    <input type="text" id="token" placeholder="Paste your reset token">
    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="At least 6 characters">
    <button class="btn" onclick="resetPassword()">Reset Password</button>
  </div>

  <div class="footer-link"><a href="login.html">← Back to Login</a></div>
</div>
<script>
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

function requestReset() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showToast('Please enter your email', 'error'); return; }
  fetch('/auth/forgot-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.success) {
      showToast('Reset token generated!', 'success');
      if (data.resetToken) {
        document.getElementById('tokenVal').textContent = data.resetToken;
        document.getElementById('tokenBox').style.display = 'block';
      }
    } else {
      showToast(data.message || 'Error', 'error');
    }
  });
}

function goToStep2() {
  var token = document.getElementById('tokenVal').textContent;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('token').value = token;
}

function resetPassword() {
  var token = document.getElementById('token').value.trim();
  var newPassword = document.getElementById('newPassword').value;
  if (!token || !newPassword) { showToast('Fill in all fields', 'error'); return; }
  if (newPassword.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
  fetch('/auth/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: token, newPassword: newPassword})
  }).then(function(r){ return r.json(); }).then(function(data) {
    if (data.success) {
      showToast('Password reset! Redirecting...', 'success');
      setTimeout(function(){ window.location.href = 'login.html'; }, 1500);
    } else {
      showToast(data.message || 'Reset failed', 'error');
    }
  });
}
</script>
</body>
</html>
