<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Detail – EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#07070f;color:#e2e8f0;min-height:100vh}
    body.light{background:#f6f7fb;color:#111827}
    nav{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,15,.9);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10}
    body.light nav{background:rgba(255,255,255,.9);border-color:#e5e7eb}
    nav a{color:inherit;text-decoration:none;font-weight:800}
    .nav-actions{display:flex;gap:10px;align-items:center}
    .nav-actions a,.theme-toggle{color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-weight:700;font-size:.85rem}
    body.light .nav-actions a,body.light .theme-toggle{color:#374151;border-color:#d1d5db;background:#fff}
    .page{max-width:1120px;margin:0 auto;padding:38px 22px}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:stretch;margin-bottom:24px}
    .panel{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:22px;overflow:hidden}
    body.light .panel{background:#fff;border-color:#e5e7eb}
    .thumb{min-height:310px;background-size:cover;background-position:center}
    .info{padding:30px}
    .badge{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(99,102,241,.18);color:#a5b4fc;font-size:.75rem;font-weight:800;text-transform:uppercase;margin-bottom:14px}
    h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1;margin-bottom:14px}
    p{color:rgba(255,255,255,.58);line-height:1.65}
    body.light p{color:#4b5563}
    .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
    .meta div{padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    body.light .meta div{background:#f9fafb;border-color:#e5e7eb}
    .meta strong{display:block;font-size:.8rem;color:rgba(255,255,255,.45);margin-bottom:3px}
    body.light .meta strong{color:#6b7280}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    button,.btn{border:0;border-radius:12px;padding:12px 20px;font-family:'Inter',sans-serif;font-weight:800;cursor:pointer;text-decoration:none}
    .primary{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
    .secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff}
    body.light .secondary{background:#fff;color:#111827;border-color:#d1d5db}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .section{padding:24px}
    .section h2{font-size:1.15rem;margin-bottom:14px}
    .lesson{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    body.light .lesson{border-color:#e5e7eb}
    .lesson:last-child{border-bottom:0}
    .syllabus{white-space:pre-line}
    .toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.25s}
    .toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.thumb{min-height:220px}}
  </style>
</head>
<body>
<nav>
  <a href="Homepage.html">🪺 EduNest</a>
  <div class="nav-actions">
    <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
    <a href="explore.html">Explore</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</nav>
<main class="page">
  <section class="hero">
    <div class="panel thumb" id="thumb"></div>
    <div class="panel info">
      <span class="badge" id="level">Course</span>
      <h1 id="title">Loading...</h1>
      <p id="desc">Loading course detail...</p>
      <div class="meta">
        <div><strong>Instructor</strong><span id="instructor">EduNest Faculty</span></div>
        <div><strong>Rating</strong><span id="rating">-</span></div>
        <div><strong>Duration</strong><span id="duration">-</span></div>
        <div><strong>Lessons</strong><span id="lessonCount">-</span></div>
        <div><strong>Students</strong><span id="students">-</span></div>
        <div><strong>Price</strong><span id="price">Free</span></div>
      </div>
      <div class="actions">
        <button class="primary" id="enrollBtn" onclick="enrollOrPay()">Enroll Now</button>
        <button class="secondary" onclick="saveLater()">Save for Later</button>
      </div>
    </div>
  </section>
  <section class="grid">
    <div class="panel section">
      <h2>Full Syllabus</h2>
      <p class="syllabus" id="syllabus">Loading syllabus...</p>
    </div>
    <div class="panel section">
      <h2>Lessons</h2>
      <div id="lessons"></div>
    </div>
  </section>
  <section class="panel section" style="margin-top:22px" id="reviewsSection">
    <h2>⭐ Ratings & Reviews</h2>
    <div id="ratingSummary" style="margin-bottom:16px"></div>
    <div id="reviewsList"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
var courseId = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('courseId');
var userId = sessionStorage.getItem('userId');
var userRole = sessionStorage.getItem('userRole') || '';
var course = null;

function courseImageFor(c){
  var key=((c.category||c.title||'')+'').toLowerCase();
  if(key.includes('cyber')||key.includes('security'))return 'Cyber-Security_Banner.jpg';
  if(key.includes('mobile'))return 'Mobile developement.jpg';
  if(key.includes('cloud')||key.includes('devops'))return 'cloud-computing.png';
  if(key.includes('web')||key.includes('ui/ux')||key.includes('design'))return 'web-design-header.jpg';
  if(key.includes('data'))return '1745405707818_Data Science Course.png';
  if(key.includes('machine')||key.includes('ml'))return '346-3460443_machine-learning-course-near-me-machine-learning-logo.png';
  return '';
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2600)}
function money(c){return c.premium ? ('₹' + (c.priceAmount || 499)) : (c.price || 'Free')}

Promise.all([
  fetch('/courses/'+courseId).then(function(r){return r.json()}),
  fetch('/lessons/course/'+courseId).then(function(r){return r.json()})
]).then(function(res){
  course=res[0]||{}; var lessons=res[1]||[];
  document.getElementById('title').textContent=course.title||'Course';
  document.getElementById('desc').textContent=course.description||'Learn with EduNest.';
  document.getElementById('level').textContent=course.level||'Course';
  document.getElementById('instructor').textContent=course.instructor||'EduNest Faculty';
  document.getElementById('rating').textContent='★ '+(course.rating||'New');
  document.getElementById('duration').textContent=course.duration||'-';
  document.getElementById('lessonCount').textContent=(lessons.length||course.lessons||0)+' lessons';
  document.getElementById('students').textContent=(course.students||0).toLocaleString();
  document.getElementById('price').textContent=money(course);
  document.getElementById('syllabus').textContent=course.syllabus||defaultSyllabus(course.title);
  var img=courseImageFor(course);
  document.getElementById('thumb').style.backgroundImage=img?'url("'+encodeURI(img)+'")':course.thumbGradient;
  document.getElementById('lessons').innerHTML=lessons.length?lessons.map(function(l,i){
    return '<div class="lesson"><strong>'+(i+1)+'. '+(l.title||'Lesson')+'</strong><span>'+((l.type||'LINK'))+'</span></div>';
  }).join(''):'<p>Lessons are being prepared by the instructor.</p>';
  var enrollBtn = document.getElementById('enrollBtn');
  if (userRole === 'ADMIN') {
    enrollBtn.textContent = 'Manage Course';
  } else if (userRole === 'INSTRUCTOR') {
    enrollBtn.textContent = 'Manage Content';
  } else {
    enrollBtn.textContent=course.premium?'Pay & Enroll':'Enroll Now';
  }
});

function defaultSyllabus(title){
  return '1. Course orientation and setup\n2. Core concepts and guided examples\n3. Practical assignments and resources\n4. Quiz checks after lessons\n5. Final project and certificate readiness';
}
function enrollOrPay(){
  if(userRole==='ADMIN'){location.href='admin-courses.html';return}
  if(userRole==='INSTRUCTOR'){location.href='instructor-panel.html';return}
  if(!userId){location.href='login.html';return}
  var url = course && course.premium ? '/payments/checkout' : '/enrollments/enroll';
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:+userId,courseId:+courseId,method:'demo-card'})})
    .then(function(r){return r.json()})
    .then(function(data){
      if(data.success===false){toast(data.message||'Already enrolled');return}
      toast(course && course.premium ? 'Payment complete. Enrolled!' : 'Enrolled successfully!');
      setTimeout(function(){location.href='course-content.html?courseId='+courseId},800);
    }).catch(function(){toast('Could not enroll right now')});
}
function saveLater(){
  if(!userId){location.href='login.html';return}
  fetch('/wishlist/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:+userId,courseId:+courseId})})
    .then(function(){toast('Saved for later')}).catch(function(){toast('Could not save')});
}

// Load ratings summary
fetch('/reviews/course/' + courseId).then(function(r){ return r.json(); }).then(function(reviews) {
  if (!reviews.length) {
    document.getElementById('ratingSummary').innerHTML = '<p style="color:rgba(255,255,255,.4);font-size:.88rem">No reviews yet.</p>';
    return;
  }
  var total = reviews.length;
  var avg = (reviews.reduce(function(s,r){ return s + r.rating; }, 0) / total).toFixed(1);
  var counts = [0,0,0,0,0];
  reviews.forEach(function(r){ if (r.rating >= 1 && r.rating <= 5) counts[r.rating-1]++; });
  var bars = [5,4,3,2,1].map(function(star) {
    var pct = total ? Math.round((counts[star-1]/total)*100) : 0;
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
      '<span style="font-size:.82rem;min-width:40px">' + star + ' ★</span>' +
      '<div style="flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden">' +
        '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:99px"></div>' +
      '</div>' +
      '<span style="font-size:.78rem;color:rgba(255,255,255,.45);min-width:30px">'+pct+'%</span>' +
    '</div>';
  }).join('');
  document.getElementById('ratingSummary').innerHTML =
    '<div style="display:flex;gap:24px;align-items:center;margin-bottom:16px">' +
      '<div style="text-align:center"><div style="font-size:3rem;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+avg+'</div>' +
      '<div style="color:#fbbf24;font-size:1.1rem">' + '★'.repeat(Math.round(avg)) + '</div>' +
      '<div style="font-size:.78rem;color:rgba(255,255,255,.4);margin-top:4px">'+total+' reviews</div></div>' +
      '<div style="flex:1">' + bars + '</div>' +
    '</div>';
  document.getElementById('reviewsList').innerHTML = reviews.slice(0,5).map(function(r) {
    return '<div style="padding:14px 0;border-top:1px solid rgba(255,255,255,.08)">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
        '<strong style="font-size:.88rem">' + (r.userName || 'Student') + '</strong>' +
        '<span style="color:#fbbf24">' + '★'.repeat(r.rating) + '</span>' +
      '</div>' +
      '<p style="font-size:.85rem">' + (r.comment || '') + '</p>' +
    '</div>';
  }).join('');
});
</script>
<script src="chatbot.js"></script></body>
</html>
