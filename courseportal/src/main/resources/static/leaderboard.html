<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard – EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#07070f;color:#e2e8f0;min-height:100vh}
    body.light{background:#f6f7fb;color:#111827}
    nav{height:64px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,15,.92);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10}
    body.light nav{background:rgba(255,255,255,.92);border-color:#e5e7eb}
    nav a{color:inherit;text-decoration:none;font-weight:800;font-family:'Inter',sans-serif}
    .nav-right{display:flex;gap:10px}
    .nav-right a{color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-weight:700;font-size:.85rem}
    body.light .nav-right a{color:#374151;background:#fff;border-color:#d1d5db}
    .page{max-width:700px;margin:0 auto;padding:40px 22px}
    h1{font-size:1.8rem;font-weight:800;margin-bottom:6px}
    .sub{color:rgba(255,255,255,.45);margin-bottom:28px}
    body.light .sub{color:#6b7280}
    .tabs{display:flex;gap:8px;margin-bottom:24px}
    .tab{padding:8px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-weight:700;font-size:.85rem;cursor:pointer}
    .tab.active{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border-color:transparent}
    body.light .tab{background:#f3f4f6;border-color:#d1d5db;color:#374151}
    body.light .tab.active{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
    .board{display:grid;gap:10px}
    .row{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 18px}
    body.light .row{background:#fff;border-color:#e5e7eb}
    .rank{font-size:1.4rem;font-weight:800;min-width:36px;text-align:center}
    .rank.gold{color:#fbbf24}
    .rank.silver{color:#94a3b8}
    .rank.bronze{color:#d97706}
    .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;flex-shrink:0}
    .info{flex:1}
    .info .name{font-weight:700;font-size:.95rem}
    .info .stat{font-size:.8rem;color:rgba(255,255,255,.45);margin-top:2px}
    body.light .info .stat{color:#6b7280}
    .score{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
  </style>
</head>
<body>
<nav>
  <a href="dashboard.html">🪺 EduNest</a>
  <div class="nav-right">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="toggleTheme()">Theme</a>
  </div>
</nav>
<main class="page">
  <h1>🏆 Leaderboard</h1>
  <p class="sub">Top learners on EduNest</p>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('courses', this)">Courses Completed</button>
    <button class="tab" onclick="switchTab('streaks', this)">🔥 Streaks</button>
  </div>
  <div class="board" id="board"></div>
</main>
<script>
var currentTab = 'courses';

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  loadBoard();
}

function loadBoard() {
  var url = currentTab === 'streaks' ? '/streaks/leaderboard' : '/leaderboard';
  fetch(url).then(function(r){ return r.json(); }).then(function(items) {
    var board = document.getElementById('board');
    if (!items.length) {
      board.innerHTML = '<div class="empty"><p>No data yet. Start learning!</p></div>';
      return;
    }
    var medals = ['🥇','🥈','🥉'];
    var rankClass = ['gold','silver','bronze'];
    board.innerHTML = items.map(function(item, i) {
      var name = item.name || 'User #' + item.userId;
      var initial = name.charAt(0).toUpperCase();
      var score = currentTab === 'streaks' ? item.currentStreak + ' day streak' : item.coursesCompleted + ' courses';
      var scoreVal = currentTab === 'streaks' ? item.currentStreak : item.coursesCompleted;
      return '<div class="row">' +
        '<div class="rank ' + (rankClass[i] || '') + '">' + (medals[i] || (i+1)) + '</div>' +
        '<div class="avatar">' + initial + '</div>' +
        '<div class="info"><div class="name">' + name + '</div><div class="stat">' + score + '</div></div>' +
        '<div class="score">' + scoreVal + '</div>' +
      '</div>';
    }).join('');
  });
}

loadBoard();
</script>
<script src="chatbot.js"></script></body>
</html>
